[project]
name = "health-nudge"
version = "0.1.0"
description = "Health Nudge analytics dashboard (aggregates only)"
authors = [
    {name = "vishnu", email = "jaihind213sg@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit (>=1.67.0,<2.0.0)",
    "duckdb (>=2.0.0,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)",
    "plotly (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "health_nudge", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "flake8-annotations (>=3.3.1,<4.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
